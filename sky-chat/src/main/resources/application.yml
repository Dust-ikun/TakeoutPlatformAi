server:
  port: 8081

spring:
  application:
    name: sky-chat
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  sql:
    init:
      mode: always          # schema.sql 幂等（IF NOT EXISTS）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/skychat
    username: skychat
    password: ${PG_PASSWORD:skychat123}
  ai:
    # DashScope 提供 OpenAI 兼容网关；Key 放 application-local.yml（不入 git）
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}
      embedding:
        options:
          model: text-embedding-v3
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true   # W1 便利开关：自动建表；生产/面试口径改为手工 schema
        distance-type: COSINE_DISTANCE

logging:
  level:
    com.sky.chat: debug

# W2 置信度分档阈值（依据 evalset-v1 跑分分布定标：
# 可答题 top1 >= 0.603，超纲题除 o05(0.652) 外 <= 0.455，
# 阈值取间隔带 [0.455, 0.603] 内 → high=0.60 / mid=0.52；
# o05 属分数门控不可分的语义邻近样本，由提示词规则兜底拒答）
sky:
  chat:
    confidence:
      high-threshold: 0.60
      mid-threshold: 0.52
    # W3 会话记忆滑动窗口（按 conversationId 隔离，进程内存储）
    memory:
      window-size: 10
